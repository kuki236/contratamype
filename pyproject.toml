[project]
name = "contratamype"
version = "0.1.0"
description = "Public procurement search, explanations and market dashboard for Peruvian MYPEs."
requires-python = ">=3.13"
dependencies = ["duckdb>=1.1", "fastapi>=0.115", "pyarrow>=18", "uvicorn>=0.34"]

[project.optional-dependencies]
dev = ["pytest>=8.3", "ruff>=0.8"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["contratamype", "api"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
